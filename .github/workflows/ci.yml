name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tuloy-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tuloy
          POSTGRES_PASSWORD: tuloy
          POSTGRES_DB: tuloy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tuloy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tuloy:tuloy@localhost:5432/tuloy
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuloy-api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: docker build -t tuloy-api:${{ github.sha }} .

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tuloy_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
