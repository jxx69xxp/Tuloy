# Local Postgres + MinIO (S3-compatible storage for photos).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tuloy
      POSTGRES_PASSWORD: tuloy
      POSTGRES_DB: tuloy
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  storage:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tuloy
      MINIO_ROOT_PASSWORD: tuloy-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [storage:/data]
  # Creates the bucket and makes it publicly readable (dev only).
  storage-init:
    image: minio/mc:latest
    depends_on: [storage]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://storage:9000 tuloy tuloy-dev-secret &&
             mc mb -p local/tuloy && mc anonymous set download local/tuloy"
volumes:
  db:
  storage:
