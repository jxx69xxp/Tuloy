name: tuloy_app
description: Tuloy hotel app — Guest, Staff and Admin in one codebase.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0 # Flutter 3.32+ (gen-l10n writes into lib/l10n)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/tuloy_icon.png
